<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: auto;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #fff59c;
        }

        #Header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        h1 {
            flex: 2;
            text-align: center;
        }

        #nav {
            text-align: center;
            display: flex;
            margin-top: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        a {
            padding: 20px;
            border-radius: 50px;
            flex-grow: 1;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }
        #nav a:hover {
            background-color: #fffacd;
        }

        .ContentBody {
            width: 40%;
            margin: auto;
        }

        form {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <h2>Simple Social</h2> 
    <h3>User Login</h3>
    <div id="nav">
        <a href="login">Login</a>
        <a href="logout">Logout</a>
        <a href="register">Register</a>
        <a href="app">Application</a>
    </div>
    <div id="ContentBody">
        <form action="/login" method="POST">
            <label>Username</label>
            <input type="text" id="username" name="username"><br>
            <label>Password</label>
            <input type="password" id="password" name="password"><br>
            <input type="submit" value="Login">
        </form>
    </div>

</body>

</html>
