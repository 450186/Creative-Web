<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: auto;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #fff59c;
        }

        #Header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        #logo {
            flex: 1;
            height: 80px;
            width: 80px;
            margin-top: 10px;
            position: absolute;
            right: 10px;
        }

        h1 {
            flex: 2;
            text-align: center;
        }

        #nav {
            text-align: center;
            display: flex;
            margin-top: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        a {
            padding: 20px;
            border-radius: 50px;
            flex-grow: 1;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        #nav a:hover {
            background-color: #fffacd;
        }

        .ContentBody {
            width: 40%;
            margin: auto;
        }

        form {
            margin-bottom: 20px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 300px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div id="Header">
        <h1>Simple Social App</h1>
        <img src="/simpleSocial starter for mongo/Assets/account.jpg" onclick="window.location.href='/account';"" alt="
            Account Details" id="logo"></img>
    </div>
    <div id="nav">
        <a href="login">Login</a>
        <a href="logout">Logout</a>
        <a href="register">Register</a>
        <a href="app">Application</a>
    </div>

    <div class="ContentBody">
        <h4>New post</h4>
        <form action="/newpost" method="POST">
            <label>message</label>
            <input type="text" id="message" name="message">
            <input type="submit" value="post message">
        </form>
        <h4>Recent posts</h4>
        <p id="recent-posts"></p>
        <script>
            const recentPosts = document.getElementById('recent-posts')

            fetch('/getposts')
                .then(response => response.json())
                .then(processData)


            function processData(data) {
                console.log(data)
                recentPosts.innerHTML = ""
                data.posts.forEach(post => {
                    let div = document.createElement('div');
                    Object.assign(div.style, {
                        marginBottom: "10px",
                        borderRadius: "50px",
                        display: "flex",
                        flexDirection: "column",
                        backgroundColor: "#ede279",
                        fontFamily: "Comic-Sans, sans-serif",
                        padding: "10px",
                        justifyContent: "center",
                        alignItems: "center"
                    });
                    let message = document.createElement('p');
                    message.innerText = post.message
                    Object.assign(message.style, {
                        fontSize: "15px",
                        fontWeight: "bold",
                    });
                    let byLine = document.createElement('p');
                    let liked = false;
                    byLine.innerText = `by user: ${post.user}`
                    let likeButton = document.createElement('button');
                    likeButton.innerText = `${post.likes}❤️`;
                    likeButton.onclick = async () => {
                        if (liked) {
                            const response = await fetch('/likepost', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ postId: post._id })
                            })
                            const successful = await response.json()
                            if (successful) {
                                likeButton.innerText = `${post.likes - 1}❤️`;
                            }
                            liked = false;
                        }
                        return;
                    }
                    if (!liked) {
                        const response = await fetch('/likepost', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ postId: post._id })
                        })
                        const successful = await response.json()
                        if (successful) {
                            likeButton.innerText = `${post.likes + 1}❤️`;
                        }
                        liked = true;
                    }

                },
                    recentPosts.appendChild(div),
                    div.appendChild(message),
                    div.appendChild(byLine),
                    div.appendChild(likeButton),
                });
            }
        </script>
    </div>
</body>

</html>
