<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="Header">
        <h1>Simple Social App</h1>
        <!-- <img src="/simpleSocial starter for mongo/Assets/account.jpg" onclick="window.location.href='/account';"" alt="
            Account Details" id="logo"></img> -->
    </div>
    <div id="nav">
        <a href="login">Login</a>
        <a href="logout">Logout</a>
        <a href="register">Register</a>
        <a href="app">Application</a>
    </div>

    <div class="ContentBody">
        <h4>New post</h4>
        <form action="/newpost" method="POST">
            <label>message</label>
            <input type="text" id="message" name="message">
            <input type="submit" value="post message">
        </form>
        <h4>Recent posts</h4>
        <p id="recent-posts"></p>
        <script>
            const recentPosts = document.getElementById('recent-posts')

            fetch('/getposts')
                .then(response => response.json())
                .then(processData)
                .catch(error => console.error('Error fetching posts:', error));


            function processData(data) {
                console.log("Fetched Data: ", data)
                recentPosts.innerHTML = ""

                const posts = data.posts || [];

                data.posts.forEach(post => {
                    let div = document.createElement('div');
                    Object.assign(div.style, {
                        marginBottom: "10px",
                        borderRadius: "50px",
                        display: "flex",
                        flexDirection: "column",
                        backgroundColor: "#ede279",
                        fontFamily: "Comic-Sans, sans-serif",
                        padding: "10px",
                        justifyContent: "center",
                        alignItems: "center"
                    });
                    let message = document.createElement('p');
                    message.innerText = post.message
                    Object.assign(message.style, {
                        fontSize: "15px",
                        fontWeight: "bold",
                    });
                    let byLine = document.createElement('p');
                    byLine.innerText = `by user: ${post.user}`

                    let likeButton = document.createElement('button');
                    likeButton.innerText = `${post.likes}❤️`;
                    likeButton.onclick = async () => {
                        likeButton.onclick = async () => {
                            try {
                                const response = await fetch('/likepost', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ postId: post._id })
                                });
                                const result = await response.json();
                                if (result.success) {
                                likeButton.innerText = `${result.newLikes} ❤️`;
                                } else {
                                console.error("Like failed:", result.message);
                                }
                            } catch (err) {
                                console.error("Error liking post:", err);
                            }
                            };
                    }
                   
                    div.appendChild(message)
                    div.appendChild(byLine)
                    div.appendChild(likeButton) 
                    recentPosts.appendChild(div)
                })
            }
        </script>
    </div>
</body>

</html>
